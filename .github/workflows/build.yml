name: build
on:
  pull_request:
  push:
  schedule:
    - cron: 35 8 3 * *
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macOS-15-intel, ghc: 9.14.1, cabal: latest, cabal-package-flags: +os-string, ghc-flags: -Werror=deprecations }
          - { os: macos-latest, ghc: 9.14.1, cabal: latest, cabal-package-flags: +os-string, ghc-flags: -Werror=deprecations }
          - { os: ubuntu-latest, ghc: 9.14.1, cabal: latest, cabal-package-flags: +os-string, ghc-flags: -Werror=deprecations }
          - { os: windows-latest, ghc: 9.14.1, cabal: latest, cabal-package-flags: +os-string, ghc-flags: -Werror=deprecations }
    runs-on: ${{ matrix.os }}
    env:
      CABAL_PACKAGE_FLAGS: ${{ matrix.cabal-package-flags }}
      GHC_FLAGS: ${{ matrix.ghc-flags }}
      TESTSCRIPT_OVERRIDES: ${{ matrix.overrides }}
      STACK_EXTRA_DEPS: ${{ matrix.stack-extra-deps }}
      STACK_PACKAGE_FLAGS: ${{ matrix.stack-package-flags }}
      STACK_RESOLVER: ${{ matrix.stack }}
    steps:
      - if: startsWith(matrix.os, 'macos-')
        run: brew install automake
      - if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
      - if: startsWith(matrix.os, 'windows-')
        run: |
          echo STACK_FLAGS=--skip-msys >> $GITHUB_ENV
          echo 'C:\msys64\usr\bin' >> $GITHUB_PATH
      - if: startsWith(matrix.os, 'windows-')
        run: |
          pacman -S --needed --noconfirm autoconf automake
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}
          enable-stack: ${{ matrix.stack }}
          stack-no-global: ${{ matrix.stack }}
      - uses: actions/checkout@v4
      - run: tools/testscript prepare
      - run: tools/testscript build
